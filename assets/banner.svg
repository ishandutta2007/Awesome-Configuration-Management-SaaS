<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.0" />
    </linearGradient>

    <radialGradient id="pulseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Card Shadow filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Dynamic Glowing Background Orbs & Network Graph -->
  <g opacity="0.6">
    <circle cx="200" cy="90" r="180" fill="url(#pulseGlow)">
      <animate attributeName="r" values="160;200;160" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="1000" cy="270" r="220" fill="url(#pulseGlow)">
      <animate attributeName="r" values="180;230;180" dur="10s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Network Connecting Lines (Infrastructure Node Flow) -->
  <g stroke="#4f46e5" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6 6">
    <line x1="120" y1="280" x2="320" y2="290">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="3s" repeatCount="indefinite" />
    </line>
    <line x1="320" y1="290" x2="520" y2="280">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="3s" repeatCount="indefinite" />
    </line>
    <line x1="520" y1="280" x2="720" y2="300">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="3s" repeatCount="indefinite" />
    </line>
    <line x1="720" y1="300" x2="920" y2="285">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="3s" repeatCount="indefinite" />
    </line>
    <line x1="920" y1="285" x2="1080" y2="295">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="3s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Dynamic Background Feature Floating Badges / Pills (Low opacity background) -->
  <g opacity="0.45" filter="url(#shadow)">
    <!-- Pill 1 -->
    <rect x="80" y="45" width="160" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="160" y="67" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚙️ Desired State</text>

    <!-- Pill 2 -->
    <rect x="270" y="35" width="170" height="34" rx="17" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
    <text x="355" y="57" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🚀 Continuous SaaS</text>

    <!-- Pill 3 -->
    <rect x="760" y="40" width="180" height="34" rx="17" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
    <text x="850" y="62" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🛡️ Compliance-as-Code</text>

    <!-- Pill 4 -->
    <rect x="970" y="50" width="150" height="34" rx="17" fill="#1e293b" stroke="#f472b6" stroke-width="1" />
    <text x="1045" y="72" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🚩 Feature Flags</text>
  </g>

  <!-- Nodes along the bottom network line -->
  <g fill="#38bdf8" opacity="0.8">
    <circle cx="120" cy="280" r="5" />
    <circle cx="320" cy="290" r="6" />
    <circle cx="520" cy="280" r="5" />
    <circle cx="720" cy="300" r="6" />
    <circle cx="920" cy="285" r="5" />
    <circle cx="1080" cy="295" r="5" />
  </g>

  <!-- Foreground Title Card Overlay for Crystal Clarity -->
  <rect x="100" y="105" width="1000" height="150" rx="16" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="1.5" filter="url(#shadow)" />

  <!-- Main Title Text (Foreground) -->
  <text x="600" y="162" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="800" text-anchor="middle" letter-spacing="0.5">
    Awesome Configuration Management SaaS
  </text>

  <!-- Subtitle Text (Foreground) -->
  <text x="600" y="202" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" text-anchor="middle" letter-spacing="0.2">
    Curated SaaS Platforms, Infrastructure Automation, Desired State &amp; Open-Source Tools
  </text>

  <!-- Tech Category Badges in Card -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
    <!-- Badge Ansible / Puppet -->
    <rect x="250" y="222" width="160" height="22" rx="11" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8" />
    <text x="330" y="237" fill="#7dd3fc" text-anchor="middle">Ansible • Puppet • Chef</text>

    <!-- Badge Terraform / Tofu -->
    <rect x="430" y="222" width="160" height="22" rx="11" fill="#1e293b" stroke="#818cf8" stroke-width="0.8" />
    <text x="510" y="237" fill="#a5b4fc" text-anchor="middle">OpenTofu • Terraform</text>

    <!-- Badge Octopus / Harness -->
    <rect x="610" y="222" width="160" height="22" rx="11" fill="#1e293b" stroke="#c084fc" stroke-width="0.8" />
    <text x="690" y="237" fill="#e9d5ff" text-anchor="middle">Octopus • Harness • Salt</text>

    <!-- Badge ConfigCat / Unleash -->
    <rect x="790" y="222" width="160" height="22" rx="11" fill="#1e293b" stroke="#f472b6" stroke-width="0.8" />
    <text x="870" y="237" fill="#fbcfe8" text-anchor="middle">ConfigCat • Unleash</text>
  </g>
</svg>
